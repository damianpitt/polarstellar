[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "polarstellar"
version = "0.0.4"
description = "Open-source desktop investigation toolkit for Stellar and Soroban"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
authors = [{name = "Damiano Pittau"}]
dependencies = [
    "httpx>=0.28,<1",
    "networkx>=3.4,<4",
    "PySide6>=6.8,<7",
    "qasync>=0.28,<1",
    "stellar-sdk>=13,<17",
]

[project.scripts]
polarstellar = "polarstellar.app.main:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/polarstellar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
